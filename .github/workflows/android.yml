name: Android CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Pinned in gradle/gradle-daemon-jvm.properties (vendor=jetbrains, version=21).
      # foojay-resolver has no JBR download URL for linux-x64, so we install it manually.
      JBR_VERSION: "21.0.11"
      JBR_BUILD: "b1163.116"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install JetBrains Runtime 21
      run: |
        set -euo pipefail
        archive="jbrsdk-${JBR_VERSION}-linux-x64-${JBR_BUILD}.tar.gz"
        url="https://cache-redirector.jetbrains.com/intellij-jbr/${archive}"
        dest="${RUNNER_TEMP}/jbr"
        mkdir -p "${dest}"
        curl --fail --silent --show-error --location \
          --retry 5 --retry-delay 5 --retry-all-errors \
          --output "${RUNNER_TEMP}/${archive}" "${url}"
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${dest}" --strip-components=1
        rm -f "${RUNNER_TEMP}/${archive}"
        echo "JAVA_HOME=${dest}" >> "${GITHUB_ENV}"
        echo "JBR_HOME=${dest}" >> "${GITHUB_ENV}"
        echo "${dest}/bin" >> "${GITHUB_PATH}"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release App Bundle
      run: ./gradlew bundleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/bundle/release/app-release.aab
